# Development profile - in-memory H2 database
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
logging.level.org.springframework=INFO

# Redis configuration for development (uses embedded Redis or local Redis instance)
# For development, you can use an embedded Redis or a local Redis server
spring.redis.host=localhost
spring.redis.port=6379
