version: '3.8'

services:
  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Leave-Management-System-Backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Cloud PostgreSQL - Replace with your cloud provider connection string
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # Cloud Redis - Replace with your cloud provider connection string
      REDIS_URL: ${REDIS_URL}

      # JWT Secret - Use environment variable or secure secret management
      JWT_SECRET: ${JWT_SECRET}

      # Cookie Security - Options: Lax, Strict, None
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE}

      # CORS - Configure for your frontend domains
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # Optional: Mail server configuration
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
    restart: unless-stopped
