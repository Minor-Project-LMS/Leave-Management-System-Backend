spring.config.import=optional:file:.env[.properties]
spring.application.name=Leave-Management-System-Backend
server.address=0.0.0.0
server.port=${PORT:8080}

# Performance: Lazy initialization for faster startup
spring.main.lazy-initialization=true

# Spring Boot Actuator Configuration (Publicly accessible)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.defaults.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.diskSpace.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.endpoints.web.base-path=/actuator

# Custom metrics configuration
management.metrics.enable.http=true
management.metrics.enable.jpa=true
management.metrics.enable.redis=true
management.metrics.enable.logback=true

# Disable Spring Security default user generation

# Database (PostgreSQL / JPA)
spring.jpa.open-in-view=false
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lms}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool optimization
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate performance optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true



# Redis (refresh token storage)
spring.redis.url=${REDIS_URL:redis://user:pass@localhost:6379}
spring.redis.timeout=2000ms
spring.data.redis.repositories.enabled=false

# Response compression for JSON payloads
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# SQL logging for performance measurement (disable in production)
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
# logging.level.org.hibernate.orm.jdbc.bind=trace

# Logging configuration (console only)
logging.config=classpath:logback-spring.xml

# Logging for security debugging
logging.level.com.lms.Leave_Management_System_Backend.security=DEBUG
logging.level.com.lms.Leave_Management_System_Backend.service.JwtUtil=DEBUG
logging.level.com.lms.Leave_Management_System_Backend.service.JwtBlacklistService=DEBUG
logging.level.com.lms.Leave_Management_System_Backend.controller.AuthController=DEBUG

# Security / Auth
spring.security.user.enabled=false

# JWT settings
jwt.secret=${JWT_SECRET:3G7zW5qqYmmvvbU2UcbHfMXoZ2AKdrvgcWL5eisngxi} # dummy-secret
jwt.access_expiration_seconds=900
jwt.refresh_expiration_seconds=18000

# Cookie security settings
cookie.same-site=${COOKIE_SAME_SITE:Lax}

# CORS configuration (comma-separated list of allowed origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2500}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=ture
spring.mail.properties.mail.smtp.starttls.required=ture
