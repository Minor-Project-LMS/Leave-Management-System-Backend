# Test configuration
spring.config.import=optional:file:.env[.properties]
spring.application.name=Leave-Management-System-Backend-Test

# H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for testing
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Redis repositories for testing
spring.data.redis.repositories.enabled=false

# Disable mail for testing
spring.mail.host=localhost
spring.mail.port=2500
spring.mail.username=
spring.mail.password=

# Security settings
spring.security.user.enabled=false
jwt.secret=test-secret-key-for-testing-only
jwt.access_expiration_seconds=900
jwt.refresh_expiration_seconds=18000

# Disable lazy initialization for tests to ensure proper bean initialization
spring.main.lazy-initialization=false
