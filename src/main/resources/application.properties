spring.config.import=optional:file:.env[.properties]
spring.application.name=Leave-Management-System-Backend

# JWT settings
jwt.secret=${JWT_SECRET:3G7zW5qqYmmvvbU2UcbHfMXoZ2AKdrvgcWL5eisngxi} # dummy-secret
jwt.access_expiration_seconds=900
jwt.refresh_expiration_seconds=18000

# Redis configuration for refresh token storage
# Cloud.redis.io connection details using URL format
spring.redis.url=${REDIS_URL:redis://user:pass@localhost:6379}
spring.redis.timeout=2000ms

# CORS configuration (comma-separated list of allowed origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}

# Cookie security settings
cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Mail settings
spring.mail.host=localhost
spring.mail.port=2500
spring.mail.username=no-reply@company.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lms}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
